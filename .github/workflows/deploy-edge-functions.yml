name: Deploy Supabase edge functions

# Auto-deploys whenever supabase/functions/** changes on main.
# Also exposes a manual "Run workflow" button — useful for re-deploying
# from your phone via the GitHub mobile app or browser without pushing
# a code change.
#
# Required GitHub secret:
#   SUPABASE_ACCESS_TOKEN  — Supabase personal access token
#     Generate at: https://supabase.com/dashboard/account/tokens
#     Add at:      Repo Settings → Secrets and variables → Actions
#
# Project ref is hard-coded for braid-boss-pro:
#   bjqazhplxqqhftekspfl

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function name to deploy (leave blank to deploy all)'
        required: false
        default: ''

concurrency:
  group: edge-fn-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: bjqazhplxqqhftekspfl
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check — secret is set
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing."
            echo "Generate at https://supabase.com/dashboard/account/tokens"
            echo "Add at  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy single function (manual run with name)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.function_name != '' }}
        run: |
          echo "Deploying single function: ${{ github.event.inputs.function_name }}"
          supabase functions deploy "${{ github.event.inputs.function_name }}" \
            --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Deploy all edge functions
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.function_name == '' }}
        run: |
          # Iterate every directory under supabase/functions that contains
          # an index.ts. Skip dotfiles and the _shared convention if it
          # ever appears.
          set -euo pipefail
          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory — nothing to deploy."
            exit 0
          fi
          deployed=0
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            case "$name" in
              _*|.*) continue ;;
            esac
            if [ ! -f "${dir}index.ts" ]; then
              echo "Skipping ${name} — no index.ts"
              continue
            fi
            echo "→ Deploying ${name}"
            supabase functions deploy "${name}" \
              --project-ref "${SUPABASE_PROJECT_REF}"
            deployed=$((deployed + 1))
          done
          echo "Deployed ${deployed} function(s)."

      - name: Summary
        if: always()
        run: |
          echo "## Edge function deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project ref:** \`${SUPABASE_PROJECT_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.function_name }}" ]; then
            echo "- **Function:** \`${{ github.event.inputs.function_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Functions:** all under \`supabase/functions/\`" >> "$GITHUB_STEP_SUMMARY"
          fi
