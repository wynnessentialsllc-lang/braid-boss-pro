name: CI

# Quality gate for pull requests (and pushes to main). Typecheck, unit
# tests, and the production build are REQUIRED — they all pass today, so
# this catches regressions without immediately blocking work. Lint is
# advisory for now: the repo carries a backlog of pre-existing lint
# errors, so it runs but does not fail the build. Flip continue-on-error
# to false once that backlog is cleared.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
