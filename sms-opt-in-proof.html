<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Braid Boss Pro — SMS opt-in proof</title>
<style>
  :root{
    --espresso:#15111A; --coffee:#3D3447; --muted:#6F6477;
    --paper:#FFFFFF; --ivory:#F6F2EC; --hairline:rgba(21,17,26,0.12);
    --gold:#7C3AED; --goldDeep:#5B21B6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ivory);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--coffee);padding:32px 16px;}
  .card{max-width:440px;margin:0 auto;background:var(--paper);
    border:1px solid var(--hairline);border-radius:20px;padding:24px;
    box-shadow:0 18px 50px rgba(21,17,26,0.10);}
  .brand{text-align:center;margin-bottom:4px;font-size:11px;font-weight:800;
    letter-spacing:0.22em;text-transform:uppercase;color:var(--goldDeep);}
  h1{text-align:center;margin:2px 0 2px;font-size:22px;color:var(--espresso);}
  .sub{text-align:center;margin:0 0 22px;font-size:13px;color:var(--muted);}
  .label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.08em;color:var(--coffee);margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=tel]{width:100%;padding:12px;border-radius:12px;
    background:transparent;color:var(--coffee);border:1px solid var(--hairline);
    font-size:14px;font-weight:600;}
  .consent{display:flex;align-items:flex-start;gap:10px;margin:6px 0 20px;}
  .consent input{margin-top:2px;width:18px;height:18px;accent-color:var(--espresso);flex-shrink:0;}
  .consent span{font-size:12px;color:var(--coffee);line-height:1.55;}
  .consent a{color:var(--espresso);text-decoration:underline;}
  .submit{width:100%;padding:14px;border-radius:12px;
    background:linear-gradient(180deg,var(--gold),var(--goldDeep));
    color:var(--paper);border:1px solid var(--goldDeep);
    font-size:14px;font-weight:700;cursor:pointer;}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Braid Boss Pro</div>
    <h1>Book your appointment</h1>
    <p class="sub">Knotless Braids · with your stylist</p>

    <div class="field">
      <span class="label">Your name</span>
      <input type="text" value="Jane Doe" />
    </div>

    <div class="field">
      <span class="label">Mobile phone</span>
      <input type="tel" value="(555) 123-4567" />
    </div>

    <label class="consent">
      <input type="checkbox" />
      <span>I agree to receive SMS messages from Braid Boss Pro and my selected stylist regarding: appointment confirmations, appointment reminders, booking updates, payment reminders, contract reminders, review requests, and rebooking reminders. These are transactional messages about my appointment; no promotional or marketing texts are sent. Message frequency varies. Message and data rates may apply. Reply <strong>STOP</strong> to opt out or <strong>HELP</strong> for assistance. Consent is not a condition of purchase. See our <a href="https://braidbosspro.app/privacy">Privacy Policy</a> and <a href="https://braidbosspro.app/terms">Terms</a>.</span>
    </label>

    <button class="submit" type="button">Request appointment</button>
    <p class="foot">You&rsquo;ll get a confirmation reply once your stylist reviews the request.</p>
  </div>
</body>
</html>
