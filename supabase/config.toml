# Supabase project configuration for Braid Boss Pro.
#
# The per-function JWT policy is pinned here so it survives
# redeploys. Anything not listed defaults to verify_jwt = true.
#
# Apply with:  supabase functions deploy <name>  (the policy is read
# from this file by the CLI on each deploy).

[functions.calendar-feed]
# PUBLIC. Apple Calendar / Google Calendar / Outlook subscribe to
# this URL on a schedule and CANNOT send an Authorization header.
# Access is gated by an opaque random token in the query string
# (looked up against calendar_feed_tokens), which can be revoked
# from the Account screen at any time.
verify_jwt = false

[functions.booking-request]
# PUBLIC. The /book/<slug> page is open to anyone with the link —
# clients submitting the booking form do not have a Supabase JWT.
# The function validates the slug, sanitises every input, and writes
# the request under the salon owner's user_id via the service role.
verify_jwt = false

[functions.stripe-webhook]
# PUBLIC. Stripe's webhook delivery does not (and cannot) carry a
# Supabase JWT — we authenticate the request instead by verifying
# the Stripe-Signature header inside the function via
# STRIPE_WEBHOOK_SECRET. Bypassing JWT verification is the standard
# Stripe pattern.
verify_jwt = false

[functions.create-checkout-session]
# Verifies the JWT inside the function (we read auth.getUser(jwt)
# off the supabase admin client) so we can mint a session bound to
# the real, server-known user.id rather than anything the client
# claims. Disabled at the platform level so we control the failure
# response shape with proper CORS.
verify_jwt = false

[functions.verify-checkout-session]
# Same pattern as create-checkout-session. The function reads the
# bearer token, calls auth.getUser, and rejects if the session
# belongs to a different user.
verify_jwt = false

# Authenticated functions (verify_jwt = true is the default, listed
# here for documentation only — no entry needed):
#
#   - send-push       (caller must be signed in; the function also
#                      double-checks via auth.getUser(jwt) so the
#                      response includes CORS on every code path)
#   - delete-account  (caller must be signed in and type "delete"
#                      to confirm before any data is removed)
